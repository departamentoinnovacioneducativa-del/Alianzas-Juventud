<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alianzas Educativas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --azul-rey: #002366;
            --blanco: #ffffff;
            --gris-claro: #f4f4f9;
        }
        body {
            background-color: var(--azul-rey);
            color: var(--blanco);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .banner {
            width: 100%;
            text-align: center;
            background-color: var(--blanco);
            padding: 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .banner img {
            max-width: 300px; /* Ajustar según alianza.png */
        }
        .container {
            background-color: var(--blanco);
            color: #333;
            padding: 30px;
            border-radius: 8px;
            margin-top: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: var(--azul-rey);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #00184a;
        }
    </style>
</head>
<body>

    <div class="banner">
        <!-- Reemplazar con la ruta real de tu servidor -->
        <img src="alianza.png" alt="Banner de Alianzas">
    </div>

    <!-- Pantalla de Login -->
    <div class="container" id="login-section">
        <h2 style="text-align: center;">Acceso al Sistema</h2>
        <form id="loginForm">
            <label for="username">Usuario:</label>
            <input type="text" id="username" required>
            
            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>
            
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <!-- El contenido de Admin o Enlace se inyectará aquí con JS tras el login -->

</body>
</html>
