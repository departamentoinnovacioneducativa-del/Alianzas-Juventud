<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alianzas Educativas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --azul-rey: #002366;
            --blanco: #ffffff;
        }
        body {
            background-color: var(--azul-rey);
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .banner {
            width: 100%;
            text-align: center;
            background-color: var(--blanco);
            padding: 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .banner img {
            max-width: 300px;
        }
        .container {
            background-color: var(--blanco);
            padding: 30px;
            border-radius: 8px;
            margin-top: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hidden { display: none; }
        input, textarea, button, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: var(--azul-rey);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #00184a; }
        h2, h3 { text-align: center; color: var(--azul-rey); }
    </style>
</head>
<body>

    <div class="banner">
        <img src="alianza.png" alt="Banner de Alianzas">
    </div>

    <!-- SECCIÓN DE LOGIN -->
    <div class="container" id="login-section">
        <h2>Acceso al Sistema</h2>
        <form id="loginForm">
            <label>Usuario:</label>
            <input type="text" id="username" required>
            <label>Contraseña:</label>
            <input type="password" id="password" required>
            <button type="submit">Ingresar</button>
        </form>
        <p id="loginError" style="color: red; text-align: center;" class="hidden">Credenciales incorrectas.</p>
    </div>

    <!-- SECCIÓN ENLACES (Formulario de captura) -->
    <div class="container hidden" id="enlaces-section">
        <h2>Registro de Alianza</h2>
        <form id="registroForm">
            <label>1. Definición de beca-convenio:</label>
            <textarea id="definicion" rows="3" required></textarea>

            <label>2. Nombre del o los enlaces:</label>
            <input type="text" id="enlaces" required>

            <label>3. Medios de contacto:</label>
            <input type="text" id="contacto" required>

            <label>4. Formas de admisión:</label>
            <textarea id="admision" rows="2" required></textarea>

            <label>5. Parte de su página donde empieza el proceso (URL):</label>
            <input type="url" id="url_inicio" required>

            <button type="submit">Enviar Solicitud</button>
        </form>
        <p id="registroExito" style="color: green; text-align: center;" class="hidden">¡Enviado con éxito!</p>
    </div>

    <!-- SECCIÓN ADMIN (Panel de control) -->
    <div class="container hidden" id="admin-section">
        <h2>Panel de Administrador</h2>
        <p>Bienvenido, Admin. Pronto conectaremos aquí el visor de datos, la creación de usuarios y la generación de PDF.</p>
        <button onclick="location.reload()">Cerrar Sesión</button>
    </div>

    <script>
        // TU URL DEL WORKER DE CLOUDFLARE
        const API_URL = "https://api-alianzas.adrian-camelot32.workers.dev";

        // LOGIC DE LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('login-section').classList.add('hidden');
                    if (data.role === 'admin') {
                        document.getElementById('admin-section').classList.remove('hidden');
                    } else {
                        document.getElementById('enlaces-section').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('loginError').classList.remove('hidden');
                }
            } catch (error) {
                alert("Error conectando con el servidor");
            }
        });

        // LOGIC DE REGISTRO (ENLACES)
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                definicion: document.getElementById('definicion').value,
                enlaces: document.getElementById('enlaces').value,
                contacto: document.getElementById('contacto').value,
                admision: document.getElementById('admision').value,
                url_inicio: document.getElementById('url_inicio').value
            };

            try {
                const res = await fetch(`${API_URL}/registro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (data.success) {
                    document.getElementById('registroForm').reset();
                    document.getElementById('registroExito').classList.remove('hidden');
                    setTimeout(() => document.getElementById('registroExito').classList.add('hidden'), 3000);
                }
            } catch (error) {
                alert("Error enviando los datos");
            }
        });
    </script>
</body>
</html>
